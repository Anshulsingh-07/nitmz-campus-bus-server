services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD with --env-file my_server/.env}
      POSTGRES_DB: ${DB_NAME:-campus_bus_tracker}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-campus_bus_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./my_server
    restart: unless-stopped
    env_file:
      - ./my_server/.env
    environment:
      DB_PORT: "5432"
      DB_HOST: "db"
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    command: node server.js

volumes:
  db_data:
